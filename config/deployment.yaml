apiVersion: apps/v1
kind: Deployment
metadata:
  name: lightspeed-agenttask-adapter
  namespace: agenttask-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: lightspeed-agenttask-adapter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lightspeed-agenttask-adapter
    spec:
      serviceAccountName: lightspeed-agenttask-adapter
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: controller
          image: ko://github.com/openshift-pipelines/agenttask-adapter-lightspeed/cmd/controller
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
      terminationGracePeriodSeconds: 10
